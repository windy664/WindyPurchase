# ============================================
# WindyPurchase 消息模板 (中文)
# ============================================
# 复制为 messages.yml 并按需修改。
# config.yml 中设置 locale: "zh" 使用中文。

order:
  created: "§a订单已创建！请完成支付："
  qr-url: "§e点击打开支付: %url%"
  paid: "§a支付成功！感谢充值 %amount%。"
  expired: "§c订单已过期。"
  cancelled: "§c订单已取消。"
  broadcast: "§6[充值] §e%player% §a购买了 §e%amount%§a！"

payment:
  alipay:
    label: "§e§l[点击打开支付宝]"
    hover: "§7点击在浏览器中打开支付宝支付页面"
  wechat:
    label: "§e§l[点击打开微信支付]"
    hover: "§7点击在浏览器中打开微信支付页面"
  paypal:
    label: "§e§l[点击前往 PayPal 支付]"
    hover: "§7点击在浏览器中打开 PayPal 结账页面"
  afdian:
    label: "§e§l[点击前往爱发电赞助]"
    hover: "§7点击在浏览器中打开爱发电赞助页面\n§7请在留言中填写你的游戏名"
  afdian-remark: "§c§l重要：§e赞助时请在「留言」中填写你的游戏名 §f%player%"
