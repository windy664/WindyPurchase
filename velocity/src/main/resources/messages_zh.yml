    pay: "§e/purchase pay <金额> [alipay|wechat|paypal|afdian] §f- 直接充值"
    history: "§e/purchase history §f- 查看订单记录"
    check: "§e/purchase check <订单ID> §f- 查询订单状态"
  list:
    title: "§6====== 商品列表 ======"
    item: "§e%id% §f- §a%name% §f| §6%price% %currency%"
