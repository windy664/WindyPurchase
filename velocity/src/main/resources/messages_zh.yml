    products: "§e/purchaseadmin products §f- 商品列表"
  reload:
    success: "§a已重载 %count% 个商品。"
    no-file: "§cproducts.yml 不存在。"
    note: "§e注意: 支付配置修改需要重启服务器才能生效。"
  stats:
    title: "§6====== 充值统计 ======"
    total: "§f总充值额: §6%amount% %currency%"
    today: "§f今日充值: §6%amount% %currency%"
    orders: "§f总订单数: §e%count%"
    ranking-title: "§6------ 充值排行 ------"
    ranking-item: "§e%rank%. §f%player% §7- §6%amount% %currency%"
  products:
    title: "§6====== 商品列表 ======"
    item: "§e%id% §f| §a%name% §f| §6%price% %currency%"
    commands: "  §7命令: %cmds%"
    permission: "  §7权限: %perm%"
    cooldown: "  §7冷却: %sec%秒"
    empty: "§c暂无商品。"

status:
  pending: "§e待支付"
  paid: "§a已支付"
  expired: "§c已过期"
  cancelled: "§c已取消"

health:
  ok: "§a正常"
