    hint: "§7使用 /purchase buy <商品ID> 购买"
  buy:
    usage: "§c用法: /purchase buy <商品ID> [alipay|wechat|paypal|afdian]"
    no-product: "§c商品不存在: %id%"
    no-permission: "§c你没有权限购买此商品。"
    creating: "§a正在创建订单..."
    failed: "§c创建订单失败，请稍后重试。"
  pay:
    usage: "§c用法: /purchase pay <金额> [alipay|wechat|paypal|afdian]"
    invalid-amount: "§c金额无效，最小 %min% %currency%。"
    creating: "§a正在创建订单..."
    failed: "§c创建订单失败，请稍后重试。"
  history:
    title: "§6====== 最近订单 ======"
    item: "§f%id% §7| §6%amount% §7| %status%"
