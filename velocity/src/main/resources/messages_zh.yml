  check:
    usage: "§c用法: /purchase check <订单ID>"
    not-found: "§c订单不存在。"
    title: "§6====== 订单详情 ======"
    order-id: "§f订单号: %id%"
    amount: "§f金额: §6%amount% %currency%"
    status: "§f状态: %status%"
    method: "§f支付方式: %method%"
    created: "§f创建时间: %time%"
    paid: "§f支付时间: %time%"
