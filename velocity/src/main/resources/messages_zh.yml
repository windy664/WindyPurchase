  select-method-hint: "§7用法: /purchase pay <金额> <alipay|wechat|paypal|afdian>"
  no-method: "§c没有可用的支付方式，请联系管理员。"
  player-only: "§c此命令只能由玩家执行。"

admin:
  help:
    title: "§6====== WindyPurchase 管理 ======"
    reload: "§e/purchaseadmin reload §f- 重载商品配置"
    stats: "§e/purchaseadmin stats §f- 充值统计"
